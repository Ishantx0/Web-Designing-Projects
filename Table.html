<html>
<head>
<title>Table</title>
</head>
<body>
<Table>
<tr>
<td>A</td>
<td>B</td>
<td>C</td>
<td>D</td>
</tr>
</Table>
<table border="5" width="2%">
<tr>
<td>A</td>
<td colspan=2>B</td>
</tr>
<tr>
<td>C</td>
<td rowspan=2>D</td>
<td>E</td>
</tr>
<tr>
<td>F</td>
<td>G</td>
</tr>
</table
</body>
</html>
