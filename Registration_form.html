<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <h1 align="center">Registration Form</h1>

    <form align="center">

        <label>Name:</label>
        <input type="text" name="name" placeholder="Enter your name">
        <br><br>

        <label>Admission No.:</label>
        <input type="text" name="admission" placeholder="Enter admission number">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email">
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter your password">
        <br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="30"
        placeholder="Enter your address"></textarea>
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <br><br>

        <label>Course:</label>
        <select name="course">
            <option value="" disabled selected>Select your course</option>
            <option value="mca">MCA</option>
            <option value="bca">BCA</option>
            <option value="mba">MBA</option>
            <option value="btech">B.Tech</option>
        </select>
        <br><br>

        <label>Skills:</label><br>
        <input type="checkbox" name="skills" value="c++"> C++<br>
        <input type="checkbox" name="skills" value="java"> Java<br>
        <input type="checkbox" name="skills" value="python"> Python<br>
        <input type="checkbox" name="skills" value="html"> HTML<br>
        <input type="checkbox" name="skills" value="css"> CSS<br>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
